# /etc/nginx/sites-available/portal-one
# portal-one 全量反代到 Node 单进程（127.0.0.1:3000）
# 由 `just nginx-install` 安装
#
# server 进程同时托管：/api（公开）+ /api/admin（后台）
# + /uploads（本地上传回退）+ web/dist + admin/dist

upstream portal_one_backend {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 上传体积：支持大视频（管理端上传 multer 上限 1GB，nginx 留同样余量）
    client_max_body_size 1024m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript
               application/javascript application/json
               image/svg+xml application/xml;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 反代到 Node 单进程
    location / {
        proxy_pass http://portal_one_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    access_log /var/log/nginx/portal-one.access.log;
    error_log  /var/log/nginx/portal-one.error.log;
}
